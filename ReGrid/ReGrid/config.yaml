# =============================================================================
# ReGrid configuration file
# =============================================================================
# This file contains the user-configurable parameters currently defined in
# main.py. Values reproduce the current defaults of the code.
#
# Notes:
# - YAML lists replace Python tuples; the loader can convert them where needed.
# - null corresponds to Python None.
# - Parameters marked LEGACY/INACTIVE are retained for completeness because
#   they are still present in the current main workflow.
# - Output filenames generated automatically from output_dir are intentionally
#   not duplicated here; they are runtime-derived paths, not analysis inputs.
# =============================================================================

config_version: 1

# -----------------------------------------------------------------------------
# GEOMETRY AND MESH
# -----------------------------------------------------------------------------
geometry:
  # 1 = barrel vault
  # 2 = parabolic dome
  # 3 = hyperbolic paraboloid (hypar)
  # 4 = Kiewitt-8 spherical dome
  geom: 3

  B: 30.0                      # x/span dimension [m]
  L: 30.0                      # y dimension [m]
  f: 3.75                      # maximum rise [m] (= B/8 for B = 30 m)

  nx: 11                       # number of grid points/subdivisions parameter along x
  ny: 11                       # number of grid points/subdivisions parameter along y

  # 1 = quadrangular
  # 2 = triangular
  grid: 1

# -----------------------------------------------------------------------------
# FILES, UNITS AND SECTION CATALOGUE
# -----------------------------------------------------------------------------
files:
  output_dir: "outputs"
  section_catalogue: "sections_1.csv"

units:
  section_catalogue_input: "cm"
  model_output: "m"

section_and_material:
  starter_section: "Ø 101,6 s 10"

  # Material definitions reproduce the tuples currently used in main.py.
  # elastic:   [model, fyk, E, G]
  # steel01:   [model, fyk, E, G, b]
  # steel02:   [model, fyk, E, G, b]
  # PPmat:     [model, fyk, E, G, ey]
  # Hardening: [model, E, fyk, H_iso, H_kin]
  materials:
    m_1: ["elastic",   355000, 210000000, 80000000]
    m_2: ["steel01",   355000, 210000000, 80000000, 0.0]
    m_3: ["steel02",   355000, 210000000, 80000000, 0.0]
    m_4: ["PPmat",     355000, 210000000, 80000000, 0.00169]
    m_5: ["Hardening", 210000000, 355000, 0, 1000]

# -----------------------------------------------------------------------------
# CORROSION
# -----------------------------------------------------------------------------
corrosion:
  enabled: true

  # End year of each consecutive exposure period.
  period_end_years: [20, 36, 50]

  # Corrosivity category associated with each period.
  categories: ["C3", "C3", "C3"]

  # Apply the final corrosion loss to the new-steel section catalogue.
  apply_to_section_database: false

  # all | flanges | web
  application_mode: "all"

  # Remove sections made geometrically invalid by section loss.
  drop_invalid_sections: true

  # Independently apply the same corrosion scenario to the reclaimed stock.
  apply_to_reuse_database: false

# -----------------------------------------------------------------------------
# OPENSEES MODEL DIMENSION AND BOUNDARY CONDITIONS
# -----------------------------------------------------------------------------
model:
  ndm: 3
  ndf: 6

boundary_conditions:
  # OpenSees fixity vector:
  # [Ux, Uy, Uz, Rx, Ry, Rz], 1 = restrained, 0 = free
  c1: [1, 1, 1, 0, 0, 0]     # boundary x = +B/2
  c2: [1, 1, 1, 0, 0, 0]     # boundary x = -B/2
  c3: [1, 1, 1, 0, 0, 0]     # boundary y = +L/2
  c4: [1, 1, 1, 0, 0, 0]     # boundary y = -L/2
  c5: [1, 1, 1, 0, 0, 0]     # corner points

# -----------------------------------------------------------------------------
# LOAD CASES
# -----------------------------------------------------------------------------
loads:
  # q1 reproduces:
  # (0.0, 0.0, 1.8, "symmetrical")
  q1:
    values: [0.0, 0.0, 1.8]
    distribution: "symmetrical"

  # q2 reproduces:
  # (0.0, 0.0, 0.6, "symmetrical",
  #  0.0, 0.0, 1.2, "asymmetrical", 1, 4)
  q2:
    symmetrical_values: [0.0, 0.0, 0.6]
    symmetrical_distribution: "symmetrical"
    asymmetrical_values: [0.0, 0.0, 1.2]
    asymmetrical_distribution: "asymmetrical"
    asymmetrical_region: [1, 4]

  # q1 | q2
  active_elastic_load_case: "q1"

# -----------------------------------------------------------------------------
# LINEAR ELASTIC ANALYSIS / SECTION ASSIGNMENT
# -----------------------------------------------------------------------------
linear_elastic:
  # 1forall | user
  section_type: "1forall"

  # Show member labels in the manual section selector.
  section_selector_show_labels: false

# -----------------------------------------------------------------------------
# RECLAIMED STEEL STOCK AND MATCHING
# -----------------------------------------------------------------------------
reuse:
  matching_enabled: false

  stock_csv: "Database_reuse_2.csv"
  length_units_in: "m"

  # Maximum length that may be trimmed from a reclaimed member [m].
  # null = no upper bound.
  max_cut_length: 10

  # Minimum residual length retained in the stock after cutting [m].
  min_remainder_length: 3

  # Allowed assemblies of L profiles.
  group_sizes: [1, 2, 4]

  # Steel unit weight [kN/m^3].
  gamma_steel: 78.5

# -----------------------------------------------------------------------------
# ENVIRONMENTAL AND ECONOMIC FACTORS
# -----------------------------------------------------------------------------
impact_and_cost:
  # Environmental factors [impact / metric tonne], except work [impact / cut].
  ecf_new: 2.5
  ecf_reused: 0.27
  ecf_work: 0.0
  ecf_scrap: 0.27

  # Economic factors [currency / metric tonne], except work [currency / cut].
  cost_new: 1250
  cost_reused: 550
  cost_work: 0.0
  cost_scrap: 250

# -----------------------------------------------------------------------------
# REUSE + GENETIC GRID OPTIMISATION
# -----------------------------------------------------------------------------
genetic:
  enabled: false
  matching_reuse_inside_loop: false

  # fast | ec3
  mech_solver: "ec3"

  # 1 | 2
  opt_mech: 2

  # Nodal movement bounds for the active quarter [m].
  move_range_x: [-0.5, 0.5]
  move_range_y: [-0.5, 0.5]

  # mono | multi
  objective_mode: "multi"

  # Available objective names currently supported include:
  # pi_mass, pi_ec, pi_mr, pi_cost, mass, cost, reuse_ratio,
  # reuse_efficiency, reuse_ratio_members, dcr_max, lscrap, n_cuts,
  # max_abs_uz, lambda_ref, ec
  obj_1: "pi_mass"
  obj_2: "pi_ec"
  obj_3: "pi_cost"

  # candidate_new | fixed_base
  reference_mode: "fixed_base"

  # In multi-objective mode, open the Pareto selector before nonlinear analysis.
  # The current code disables this automatically in batch mode.
  select_pareto_for_nonlinear: true

  # auto | pymoo | builtin
  engine: "pymoo"

  population: 1500
  generations: 10
  seed: 42
  verbose: 1

  progress_heartbeat_s: 30.0

  # null = wait indefinitely.
  candidate_stall_timeout_s: 900.0

  suppress_evaluation_output: true
  terminal_progress_every: 50

  # null -> pymoo default, normally equal to population size.
  n_offsprings: null

  # real_random | lhs
  sampling: "lhs"

  eliminate_duplicates: true

  crossover:
    probability: 0.90
    eta: 10.0

  mutation:
    probability: 0.50
    eta: 10.0
    # Used by the built-in GA.
    scale: 0.10

  # 1 = serial evaluation.
  n_workers: 20

  # Structural feasibility constraints used by the GA.
  buckling_mode: 1
  dcr_limit: 1.0
  displacement_limit: 0.15
  buckling_lambda_min: 1.0

  merchant_rankine:
    enabled: true
    minimum: 1.0
    # null -> use genetic.buckling_mode
    mode: 1

  reuse_member_mask:
    enabled: true
    threshold: 0.5
    # member | symmetric | global
    mode: "symmetric"

  # ---------------------------------------------------------------------------
  # OPTIONAL GA-CONTROLLED DESIGN/CONSTRAINT VARIABLES
  # When enabled, the corresponding parameter is itself sampled by the GA.
  # ---------------------------------------------------------------------------
  controlled_variables:
    ga_dcr_limit:
      enabled: false
      range: [0.1, 1.0]

    ga_displacement_limit:
      enabled: false
      range: [0.05, 0.30]

    ga_buckling_limit:
      enabled: false
      range: [1.0, 5.0]

    ga_merchant_rankine_limit:
      enabled: false
      range: [1.0, 3.0]

    reuse_max_cut_length:
      enabled: false
      # Sampled by the GA and rounded to integer metres before matching.
      range: [0.0, 10.0]

    optimizer_dcr_limit:
      enabled: false
      range: [0.1, 0.9]

    optimizer_displacement_limit:
      enabled: false
      range: [0.05, 0.30]

    optimizer_buckling_limit:
      enabled: false
      range: [1.0, 5.0]

    optimizer_merchant_rankine_limit:
      enabled: false
      range: [1.0, 3.0]

  # Resume/headless options.
  resume:
    from_metrics: false
    metrics_csv: null       # null -> genetic_search/genetic_candidate_metrics.csv
    headless_exit_after_ga: false

# -----------------------------------------------------------------------------
# EUROCODE 3 CHECK PARAMETERS
# -----------------------------------------------------------------------------
ec3:
  gamma_M0: 1.05
  gamma_M1: 1.05
  gamma_M2: 1.25

  # Effective-length / end-condition coefficient used by the current workflow.
  # Current code comment:
  # 1.00 = app.-app.; 2.00 = cantilever; 0.80 = fixed-fixed/related case.
  beta: 1.0

  # OpenSees axial-force sign convention used by this workflow.
  compression_sign: "negative"

  alpha_LT: 0.76

# -----------------------------------------------------------------------------
# GLOBAL MECHANICAL SECTION OPTIMISATION
# -----------------------------------------------------------------------------
mechanical_optimization:
  enabled: true

  # 1 = one section for all members
  # 2 = multiple-section optimisation
  mode: 2

  dcr_limit: 1.0

  displacement:
    check: true
    limit: 0.15             # maximum admissible vertical lowering |Uz| [m]

  buckling:
    check: true
    lambda_min: 1.0
    mode: 1
    retries: 100
    # null = automatic quota based on the lambda gap.
    group_limit: null

  merchant_rankine:
    check: false
    minimum: 1.0
    # null -> use mechanical_optimization.buckling.mode
    mode: 1

  max_iterations: 100
  verbose: 1

  # Starting row/index in the section catalogue.
  start_section_row: 5

  # LEGACY / currently inactive with the restored mechanical optimiser.
  legacy:
    section_group_limit: 8
    section_symmetry: null
    demand_grouping: true
    demand_group_relative_tolerance: 0.2

# -----------------------------------------------------------------------------
# INTERNAL MECHANICAL OPTIMISATION USED FOR EACH GA CANDIDATE
# -----------------------------------------------------------------------------
genetic_mechanical_optimization:
  start_section_row: 5
  max_iterations: 100

  dcr_limit: 1.0

  displacement:
    check: true
    limit: 0.15

  buckling:
    check: true
    lambda_min: 1.0
    mode: 1
    retries: 100
    group_limit: null

  merchant_rankine:
    check: true
    minimum: 1.0
    mode: 1

  # LEGACY / currently inactive with the restored mechanical optimiser.
  legacy:
    section_group_limit: 8
    section_symmetry: null
    demand_grouping: true
    demand_group_relative_tolerance: 0.2

# -----------------------------------------------------------------------------
# NONLINEAR ANALYSIS
# -----------------------------------------------------------------------------
nonlinear:
  enabled: true

  # Lobatto | HingeRadau | HingeRadauTwo
  fiber_element: "HingeRadauTwo"

  lobatto_n_integration_points: 5

  # Current main.py derives this value as:
  # 0.50 for HingeRadauTwo, otherwise 0.10.
  # Set to "auto" to preserve that behaviour.
  hinge_length_ratio: "auto"

  # Force | Displacements | ArcLength
  analysis_control: "Force"

  force_control:
    use_fallbacks: true
    use_adaptive_step: false

    fallback_strategies:
      - algorithm: ["NewtonLineSearch"]
        test: ["NormUnbalance", 1.0e-5, 150]

      - algorithm: ["KrylovNewton", "-maxDim", 3]
        test: ["NormUnbalance", 1.0e-5, 200]

      - algorithm: ["NewtonLineSearch", "-type", "Bisection", "-maxIter", 50]
        test: ["NormUnbalance", 1.0e-5, 200]

      - algorithm: ["SecantNewton", "-maxDim", 3]
        test: ["NormUnbalance", 1.0e-5, 200]

      - algorithm: ["Newton", "-initialThenCurrent"]
        test: ["NormUnbalance", 1.0e-5, 200]

    solver_options:
      force_min_increment: 1.0e-6
      force_cutback_factor: 0.5
      force_easy_iterations: 8
      force_slow_iterations: 16
      fallback_growth_steps: 10
      fallback_growth_factor: 1.25
      force_max_attempts: 90

    fixed_step_max_steps: 1000
    adaptive_max_steps: 10000

  # Maximum Uz displacement used to stop nonlinear analysis [m].
  uz_limit: 1.0

  local_instability_postprocessing: true

# -----------------------------------------------------------------------------
# FIBRE DISCRETISATION
# -----------------------------------------------------------------------------
fibers:
  plot_sections: false
  show_section_plots: false

  # CHS discretisation.
  n_circ: 8
  n_rad: 1

  # [web_y, web_z, flange_y, flange_z, rotation_deg]
  L:  [1, 8, 8, 1, 0.0]
  2L: [1, 8, 8, 1, 0.0]
  4L: [1, 8, 8, 1, -90.0]

# -----------------------------------------------------------------------------
# PLOT / EXPORT / DEBUG CONTROLS
# -----------------------------------------------------------------------------
plotting:
  geometry: false
  mesh: false
  opensees_model: false
  deformed_shape: false
  buckling_shape: false
  buckling_curve_points: 10
  section_plan: false
  nonlinear_live_plot: false

  save_load_map: true
  show_load_map: false

  write_opensees_code: true
  force_diagram: false
